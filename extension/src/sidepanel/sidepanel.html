<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wally</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #ff6b35;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: white;
    }
    h1 { font-size: 16px; margin: 0; color: #fff; }

    /* URL input */
    .url-group { margin-bottom: 12px; }
    .url-group label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .url-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #3d3d5c;
      border-radius: 6px;
      background: #2d2d44;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    .url-input:focus { border-color: #ff6b35; }
    .url-input::placeholder { color: #555; }

    /* Status */
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status.idle { background: #2d2d44; color: #a0a0a0; }
    .status.recording { background: #3d1f1f; color: #ff6b6b; }
    .status .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .status.recording .dot {
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 6px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-record { background: #ff6b35; color: white; }
    .btn-stop { background: #ff4444; color: white; }
    .btn-export { background: #4a9eff; color: white; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Live log */
    .log-section { margin-top: 10px; }
    .log-header {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .log-header .count { color: #ff6b35; font-weight: 600; }
    .log {
      background: #111122;
      border: 1px solid #2d2d44;
      border-radius: 6px;
      padding: 8px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 11px;
      line-height: 1.5;
    }
    .log-entry { color: #a0a0a0; }
    .log-entry .type {
      color: #ff6b35;
      font-weight: 600;
    }
    .log-entry .time { color: #555; }
    .log-entry .detail { color: #777; }
    .log-entry.replay-error { color: #ff6b6b; }
    .log-entry.replay-error .type.error {
      color: #ff4444;
      font-weight: 700;
    }
    .log-entry.replay-error .error-msg {
      color: #ff8888;
      font-size: 10px;
      display: block;
      margin-left: 60px;
      margin-top: 2px;
      word-break: break-word;
    }

    /* Sessions */
    .sessions { margin-top: 12px; }
    .sessions h3 {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 6px 0;
    }
    .session-item {
      padding: 6px 8px;
      background: #2d2d44;
      border-radius: 4px;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .session-actions { display: flex; gap: 3px; }
    .session-btn {
      padding: 3px 6px;
      border: none;
      border-radius: 3px;
      font-size: 10px;
      cursor: pointer;
    }
    .session-btn.export { background: #4a9eff; color: white; }
    .session-btn.delete { background: #ff4444; color: white; }

    /* Bridge status */
    .bridge-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 11px;
    }
    .bridge-badge {
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .bridge-badge.connected {
      background: #1a3d1a;
      color: #4caf50;
      border: 1px solid #2d5a2d;
    }
    .bridge-badge.web-only {
      background: #3d3d1a;
      color: #ffc107;
      border: 1px solid #5a5a2d;
    }
    .bridge-notice {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">W</div>
    <h1>Wally</h1>
  </div>

  <!-- URL input (like CLI --url) -->
  <div class="url-group">
    <label>Target URL</label>
    <input id="urlInput" class="url-input" type="url"
           placeholder="https://example.com"
           value="https://">
  </div>

  <div id="status" class="status idle">
    <span class="dot"></span>
    <span id="statusText">Ready to record</span>
  </div>

  <!-- Bridge status badge -->
  <div id="bridgeStatus" class="bridge-status" style="display:none">
    <span id="bridgeBadge" class="bridge-badge">Web-only</span>
    <span id="bridgeNotice" class="bridge-notice" style="display:none">Popups require daemon (port 9222)</span>
  </div>

  <button id="recordBtn" class="btn btn-record">
    ⏺ Start Recording
  </button>

  <button id="stopBtn" class="btn btn-stop" style="display:none">
    ⏹ Stop Recording
  </button>

  <button id="exportBtn" class="btn btn-export" disabled>
    ⬇ Export Session
  </button>

  <!-- Live log -->
  <div class="log-section" id="logSection" style="display:none">
    <div class="log-header">
      <span>Live Log</span>
      <span class="count" id="actionCount">0 actions</span>
    </div>
    <div class="log" id="log"></div>
  </div>

  <!-- Past sessions -->
  <div class="sessions" id="sessions"></div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
