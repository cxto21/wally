<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wally</title>
  <style>
    :root {
      --wally-bg: #0f1115;
      --wally-mint: #B8F5D8;
      --wally-mint-hover: #A3EDC9;
      --wally-glass-bg: rgba(255, 255, 255, 0.08);
      --wally-glass-border: rgba(255, 255, 255, 0.18);
      --wally-glass-blur: blur(12px);
      --wally-text-primary: #fff;
      --wally-text-secondary: rgba(255, 255, 255, 0.85);
      --wally-text-muted: rgba(255, 255, 255, 0.42);
      --wally-status-green: #4ADE80;
      --wally-status-red: #ef4444;
      --wally-radius: 16px;
      --wally-pill: 999px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: var(--wally-bg);
      color: var(--wally-text-primary);
      min-height: 100vh;
    }

    /* Header / nav */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: var(--wally-mint);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: var(--wally-bg);
    }
    h1 {
      font-size: 16px;
      margin: 0;
      color: var(--wally-text-primary);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* URL input */
    .url-group { margin-bottom: 12px; }
    .url-group label {
      display: block;
      font-size: 11px;
      color: var(--wally-text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .url-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--wally-glass-border);
      border-radius: 8px;
      background: var(--wally-bg);
      color: var(--wally-text-secondary);
      font-size: 13px;
      outline: none;
    }
    .url-input:focus { border-color: var(--wally-mint); }
    .url-input::placeholder { color: var(--wally-text-muted); }

    /* Status */
    .status {
      padding: 8px 12px;
      border-radius: var(--wally-radius);
      margin-bottom: 10px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status.idle {
      background: var(--wally-glass-bg);
      backdrop-filter: var(--wally-glass-blur);
      border: 1px solid var(--wally-glass-border);
      color: var(--wally-text-muted);
    }
    .status.recording {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--wally-status-red);
    }
    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status.idle .dot { background: var(--wally-status-green); }
    .status.recording .dot {
      background: var(--wally-status-red);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Pill buttons */
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: var(--wally-pill);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 6px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-record { background: var(--wally-mint); color: var(--wally-bg); }
    .btn-stop { background: var(--wally-status-red); color: #fff; }
    .btn-export {
      background: var(--wally-glass-bg);
      border: 1px solid var(--wally-glass-border);
      color: var(--wally-text-secondary);
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Live log */
    .log-section { margin-top: 10px; }
    .log-header {
      font-size: 11px;
      color: var(--wally-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .log-header .count { color: var(--wally-mint); font-weight: 600; }
    .log {
      background: var(--wally-glass-bg);
      backdrop-filter: var(--wally-glass-blur);
      border: 1px solid var(--wally-glass-border);
      border-radius: var(--wally-radius);
      padding: 8px;
      max-height: 300px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
    }
    .log-entry { color: var(--wally-text-muted); }
    .log-entry .type {
      color: var(--wally-mint);
      font-weight: 600;
    }
    .log-entry .time { color: var(--wally-text-muted); }
    .log-entry .detail { color: var(--wally-text-secondary); }
    .log-entry .hierarchy-badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: var(--wally-pill);
      background: rgba(184, 245, 216, 0.12);
      color: var(--wally-mint);
      margin-left: 4px;
      vertical-align: middle;
    }
    .log-entry.replay-error { color: var(--wally-status-red); }
    .log-entry.replay-error .type.error {
      color: var(--wally-status-red);
      font-weight: 700;
    }
    .log-entry.replay-error .error-msg {
      color: rgba(239, 68, 68, 0.7);
      font-size: 10px;
      display: block;
      margin-left: 60px;
      margin-top: 2px;
      word-break: break-word;
    }

    /* Sessions */
    .sessions { margin-top: 12px; }
    .sessions h3 {
      font-size: 11px;
      color: var(--wally-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 6px 0;
    }
    .session-item {
      padding: 6px 8px;
      background: var(--wally-glass-bg);
      border: 1px solid var(--wally-glass-border);
      border-radius: var(--wally-radius);
      backdrop-filter: var(--wally-glass-blur);
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .session-actions { display: flex; gap: 3px; }
    .session-btn {
      padding: 3px 6px;
      border: none;
      border-radius: var(--wally-pill);
      font-size: 10px;
      cursor: pointer;
    }
    .session-btn.export { background: var(--wally-mint); color: var(--wally-bg); }
    .session-btn.delete { background: rgba(239, 68, 68, 0.2); color: var(--wally-status-red); }

    /* Bridge status */
    .bridge-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 11px;
    }
    .bridge-badge {
      padding: 2px 8px;
      border-radius: var(--wally-pill);
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .bridge-badge.connected {
      background: rgba(74, 222, 128, 0.12);
      color: var(--wally-status-green);
      border: 1px solid rgba(74, 222, 128, 0.25);
    }
    .bridge-badge.web-only {
      background: rgba(251, 191, 36, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.25);
    }
    .bridge-notice {
      color: var(--wally-text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">W</div>
    <h1>Wally</h1>
  </div>

  <!-- URL input (like CLI --url) -->
  <div class="url-group">
    <label>Target URL</label>
    <input id="urlInput" class="url-input" type="url"
           placeholder="https://example.com"
           value="https://">
  </div>

  <div id="status" class="status idle">
    <span class="dot"></span>
    <span id="statusText">Ready to record</span>
  </div>

  <!-- Bridge status badge -->
  <div id="bridgeStatus" class="bridge-status" style="display:none">
    <span id="bridgeBadge" class="bridge-badge">Web-only</span>
    <span id="bridgeNotice" class="bridge-notice" style="display:none">Popups require daemon (port 9222)</span>
  </div>

  <button id="recordBtn" class="btn btn-record">
    ⏺ Start Recording
  </button>

  <button id="stopBtn" class="btn btn-stop" style="display:none">
    ⏹ Stop Recording
  </button>

  <button id="exportBtn" class="btn btn-export" disabled>
    ⬇ Export Session
  </button>

  <!-- Live log -->
  <div class="log-section" id="logSection" style="display:none">
    <div class="log-header">
      <span>Live Log</span>
      <span class="count" id="actionCount">0 actions</span>
    </div>
    <div class="log" id="log"></div>
  </div>

  <!-- Past sessions -->
  <div class="sessions" id="sessions"></div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
