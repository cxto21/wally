<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wally</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #ff6b35;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: white;
    }
    h1 {
      font-size: 16px;
      margin: 0;
      color: #fff;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status.idle {
      background: #2d2d44;
      color: #a0a0a0;
    }
    .status.recording {
      background: #3d1f1f;
      color: #ff6b6b;
      border: 1px solid #ff6b6b33;
    }
    .status.exported {
      background: #1f3d1f;
      color: #6bff6b;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-record { background: #ff6b35; color: white; }
    .btn-stop { background: #ff4444; color: white; }
    .btn-export { background: #4a9eff; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .sessions {
      margin-top: 16px;
      font-size: 12px;
      color: #888;
    }
    .session-item {
      padding: 8px;
      background: #2d2d44;
      border-radius: 4px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .session-actions { display: flex; gap: 4px; }
    .session-btn {
      padding: 4px 8px;
      border: none;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
    }
    .session-btn.export { background: #4a9eff; color: white; }
    .session-btn.delete { background: #ff4444; color: white; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">W</div>
    <h1>Wally</h1>
  </div>
  
  <div id="status" class="status idle">
    Ready to record
  </div>
  
  <button id="recordBtn" class="btn btn-record">
    ⏺ Start Recording
  </button>
  
  <button id="exportBtn" class="btn btn-export" disabled>
    ⬇ Export Last Session
  </button>
  
  <div id="sessions" class="sessions"></div>
  
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
